[project]
name = "sanad-worker"
version = "0.0.0"
description = "Sanad background worker: claims jobs from the Postgres queue and runs handlers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "sentry-sdk==2.72.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "psycopg[binary]==3.3.6",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanad_worker"]

[project.scripts]
sanad-worker = "sanad_worker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]
