[project]
name = "sanad-ingress"
version = "0.0.0"
description = "Sanad ingress: the GitHub App webhook, the install callback and sandbox result uploads."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.146.0",
  "sentry-sdk==2.72.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanad_ingress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]
